name: Release

permissions:
  id-token: write # Required for OIDC (npm trusted publishing + provenance)
  contents: write # Required to push the version tag

on: workflow_dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    # References a GitHub Environment named "npm". Keep it if your npm trusted
    # publisher is scoped to this environment; otherwise this line can be removed.
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Update npm to the latest version to enable OIDC trusted publishing.
      # Use corepack to install pnpm (pinned via the packageManager field).
      - name: Setup package managers
        run: |
          npm install -g npm@latest
          npm --version
          npm install -g corepack@latest --force
          corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: version_to_release
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            return 'v' + packageJson.version;

      - name: Publish to npm
        run: |
          git tag ${{ steps.version_to_release.outputs.result }}
          git push origin ${{ steps.version_to_release.outputs.result }}
          pnpm publish --no-git-checks

      - name: GitHub Release
        run: pnpx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
